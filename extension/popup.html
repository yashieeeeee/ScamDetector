<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>ScamDetector</title>
  <script src="puter.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { width: 380px; font-family: system-ui, sans-serif; background: #0f0f0f; color: #f0f0f0; }

    .header { display: flex; align-items: center; gap: 10px; padding: 16px; border-bottom: 1px solid #222; }
    .header-icon { width: 32px; height: 32px; background: #2a0a0a; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 18px; }
    .header h1 { font-size: 16px; font-weight: 600; }
    .header p { font-size: 11px; color: #888; margin-top: 1px; }

    .body { padding: 14px; }

    textarea {
      width: 100%; height: 110px; background: #1a1a1a; border: 1px solid #2a2a2a;
      border-radius: 8px; color: #f0f0f0; font-size: 13px; padding: 10px;
      resize: none; font-family: inherit; outline: none;
    }
    textarea:focus { border-color: #444; }

    .btn {
      width: 100%; margin-top: 10px; padding: 10px;
      background: #f0f0f0; color: #0f0f0f; border: none;
      border-radius: 8px; font-size: 14px; font-weight: 600;
      cursor: pointer; transition: opacity 0.15s;
    }
    .btn:disabled { opacity: 0.4; cursor: not-allowed; }

    .result { margin-top: 12px; border-radius: 8px; overflow: hidden; }

    .verdict-bar { padding: 12px 14px; display: flex; align-items: center; gap: 10px; }
    .verdict-bar .icon { font-size: 20px; }
    .verdict-bar .label { font-size: 15px; font-weight: 600; }
    .verdict-bar .score { margin-left: auto; font-size: 12px; opacity: 0.8; }

    .SAFE .verdict-bar { background: #0f2d0f; }
    .SAFE .label { color: #5dba5d; }
    .WARNING .verdict-bar { background: #2d1f00; }
    .WARNING .label { color: #f0a832; }
    .DANGER .verdict-bar { background: #2d0a0a; }
    .DANGER .label { color: #e05555; }

    .summary { padding: 10px 14px; font-size: 13px; line-height: 1.6; background: #161616; color: #ccc; }

    .flags { padding: 8px 14px 4px; background: #161616; border-top: 1px solid #222; }
    .flag { display: flex; gap: 8px; align-items: flex-start; padding: 5px 0; font-size: 12px; color: #aaa; }
    .flag.danger { color: #e05555; }
    .flag.warning { color: #f0a832; }
    .flag.safe { color: #5dba5d; }

    .advice { padding: 10px 14px; background: #111; border-top: 1px solid #222; font-size: 12px; color: #888; line-height: 1.5; }

    .error { margin-top: 10px; padding: 10px; background: #2d0a0a; border-radius: 8px; font-size: 13px; color: #e05555; }

    .loading { text-align: center; padding: 20px; color: #888; font-size: 13px; }
    .spinner { display: inline-block; width: 16px; height: 16px; border: 2px solid #333; border-top-color: #f0f0f0; border-radius: 50%; animation: spin 0.7s linear infinite; vertical-align: -3px; margin-right: 6px; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="header">
    <div class="header-icon">🛡️</div>
    <div>
      <h1>ScamDetector</h1>
      <p>Paste any message, email or link</p>
    </div>
  </div>
  <div class="body">
    <textarea id="input" placeholder='e.g. "Congratulations! You won $10,000. Click here to claim..."'></textarea>
    <button class="btn" id="scanBtn" disabled>Check for Scams</button>
    <div id="output"></div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
